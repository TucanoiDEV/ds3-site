# Atualiza a aba "Conteúdos da Web" (public/web/conteudos.json) a cada 6 horas e
# publica o site no GitHub Pages. Também publica a cada push na main.
name: Atualizar e publicar o site

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Buscar publicações recentes
        run: python tools/gerar_web.py

      # Commits feitos com o GITHUB_TOKEN não disparam outro workflow, então não há loop
      - name: Salvar no repositório se houver novidades
        run: |
          git add public/web/conteudos.json
          if git diff --cached --quiet; then
            echo "Sem novidades."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git commit -m "Atualiza conteúdos da web"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx vite build --base=./

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
