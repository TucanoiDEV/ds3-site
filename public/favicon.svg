<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 2 56 56">
  <!-- Fogueira do DS3: a Espada Espiralada cravada nas cinzas, envolta em chamas -->
  <defs>
    <linearGradient id="chama" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f3d38a"/>
      <stop offset="0.45" stop-color="#e0612a"/>
      <stop offset="1" stop-color="#8a2a10"/>
    </linearGradient>
    <linearGradient id="cinzas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b6258"/>
      <stop offset="1" stop-color="#2a2420"/>
    </linearGradient>
  </defs>

  <!-- chamas -->
  <path d="M32 14c4 7 13 13 13 25 0 8-6 13-13 13s-13-5-13-13c0-7 4-11 6-16 1 4 3 6 4 6-1-6 1-11 3-15z" fill="url(#chama)"/>
  <path d="M33 26c3 5 7 8 7 14 0 5-4 8-8 8s-8-3-8-8c0-4 3-7 4-10 1 3 2 4 3 4 0-3 1-6 2-8z" fill="#f3d38a" opacity="0.85"/>

  <!-- espada espiralada -->
  <g transform="rotate(-8 32 34)">
    <circle cx="32" cy="7.5" r="2.6" fill="none" stroke="#5a4532" stroke-width="1.6"/>
    <rect x="30.8" y="9.5" width="2.4" height="7" fill="#5a4532"/>
    <rect x="25" y="16" width="14" height="2.6" rx="1" fill="#5a4532"/>
    <path d="M30.2 18.6h3.6l-0.6 28h-2.4z" fill="#5a4532"/>
    <path d="M30.6 21l2.8 3.5M30.6 26l2.8 3.5M30.6 31l2.8 3.5M30.6 36l2.8 3.5M30.6 41l2.6 3.2" stroke="#e0612a" stroke-width="1.1" stroke-linecap="round"/>
  </g>

  <!-- pilha de cinzas e ossos -->
  <path d="M10 56c3-7 10-10 22-10s19 3 22 10z" fill="url(#cinzas)"/>
  <path d="M17 52.5l8-2.5M40 50l7 3M28 54l6-1.5" stroke="#cfc4b0" stroke-width="1.6" stroke-linecap="round"/>
</svg>
